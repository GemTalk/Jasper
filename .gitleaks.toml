# Gitleaks configuration for the release pipeline's scan of the packaged .vsix.
#
# Open VSX runs its own gitleaks-based scan server-side, AFTER accepting an
# upload, and offers no way to allow a false positive. A hit there leaves the
# version inactive or rejected — and by then the version number is spent,
# because both registries are immutable per (publisher, name, version). This
# repo has been bitten twice (1.7.6 and 1.8.3, both GemStone's *public*
# default password 'swordfish'), each time failing only the Open VSX half
# after the Marketplace had already published. Scanning the package ourselves,
# before anything is uploaded, turns that into a re-dispatch instead.
#
# The scan target is the UNZIPPED .vsix, not the working tree: the tree both
# misses what ships (the esbuild bundles are in the package but not in git)
# and floods on what does not (.vscodeignore excludes client/tmp/**, ~1GB of
# fixtures including example private keys).
#
# Because esbuild inlines every dependency into one file, our code and vendor
# code share `extension.js` and cannot be separated by path. The allowlists
# below are therefore matched on the secret text itself and kept as narrow as
# the false positive allows, so a real secret in the same file is still caught.

[extend]
useDefault = true

[[allowlists]]
description = """
Class identifiers from the bundled ASN.1/PKCS crypto libraries. gitleaks'
generic-api-key rule scores these on entropy as though the identifier were a
key. Anchored to the exact names so an unrelated high-entropy assignment is
still reported.
"""
regexTarget = "secret"
regexes = [
    '''^(RecipientEncryptedKeys|PKCS8ShroudedKeyBag)(_\d+)?$''',
]

[[allowlists]]
description = """
PEM delimiter literals inside code that parses and formats PEM, not key
material. gitleaks' private-key rule spans from a BEGIN marker to an END
marker, and in PEM-handling code both appear on one line with only code
between them. The alternatives below require the delimiter to be followed
immediately by a regex terminator or by the end of a JavaScript string —
a real embedded key has base64 there instead, so it still trips the rule.
"""
regexTarget = "secret"
regexes = [
    '''^-----BEGIN [A-Z ]*PRIVATE KEY-----(/|\\n"\s*\+)''',
]

# Open VSX's scanner runs rules gitleaks' default set does not, and the one
# that has actually rejected this repo is among them: a default `gitleaks dir`
# over the 1.9.0 package does NOT flag either form of the password literal
# that failed 1.7.6 and 1.8.3. Scanning with the defaults alone would sail
# past the exact failure this job exists to prevent, so the rule is restated
# here explicitly.
#
# It mirrors client/src/__tests__/publishSecretScan.test.ts, which stays: that
# test fails in seconds on a developer's machine and in every PR, long before
# a release is dispatched. This is the backstop that also covers the bundle,
# server/, mcp-server/ and resources/ — everything the .vsix actually ships
# and the unit test never sees.
[[rules]]
id = "gemstone-password-literal"
description = "A `password`-suffixed key assigned a short quoted literal — the form Open VSX's hashicorp-tf-password rule rejects"
regex = '''(?i)password\w*\s*[:=]\s*["'][A-Za-z0-9]{7,20}["']'''
tags = ["password", "open-vsx"]
