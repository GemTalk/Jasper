name: Release

# Manual publish pipeline. It deliberately does NOT bump the version or write
# the changelog: promoting `[Unreleased]` to a dated `[X.Y.Z]` section, and
# sweeping `main` for changes that never wrote an entry, are editorial calls.
# Those land as an ordinary release PR through the merge queue, and this
# workflow then publishes a commit that is already on main and already green.
#
# The job order is chosen around what can be undone. Publishing to a registry
# is the only irreversible step here: both registries are immutable per
# (publisher, name, version), and even deleting a version leaves the identity
# reserved — so a botched publish burns X.Y.Z permanently and the only way
# forward is X.Y.Z+1. Everything recoverable therefore happens first, and the
# GitHub Release is created BEFORE either registry sees the file, so the bytes
# each registry receives come from an immutable Release asset rather than from
# a rebuild that could differ.
#
# See docs/how-to/publishing-a-release.md for the whole procedure, including
# how the two registry tokens are obtained.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.9.1. Must match package.json on main.'
        required: true
        type: string
      dry-run:
        description: 'Run every check, build the .vsix and scan it, but create no release and publish nothing.'
        required: false
        default: false
        type: boolean

# Nothing is granted by default: each job below asks for exactly what it needs,
# so a job added later cannot quietly inherit access it was never given.
permissions: {}

# Never let two releases interleave: they would race on the same tag and the
# same marketplace version. Queue instead of cancelling — a cancelled run that
# had already uploaded to one registry is worse than a delayed one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything checkable without a credential or a build, so an obvious
  # mistake fails in seconds rather than after a reviewer has been asked to
  # approve something.
  validate:
    name: Validate
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    # zizmor(template-injection): bind the dispatch input to an env var
    # instead of interpolating ${{ }} directly into a run script
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # This job checks nothing out. Every check is made over the API, and the
      # two files it inspects are treated as data — grep and jq, never
      # executed — so no repository code runs on this runner at all. Reading
      # the content of a commit is safe; running it is not.
      #
      # There is deliberately no `ref` input. The workflow always publishes the
      # tip of the default branch it was dispatched against, which is the only
      # thing the checks below can meaningfully assert about. An input naming
      # an arbitrary commit would make the later `npm ci` a privileged
      # checkout of dispatcher-chosen code, which is what CodeQL flagged on
      # the first draft of this workflow.
      - name: Validate the version string
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: version must be X.Y.Z (got '$VERSION')." >&2
            exit 1
          fi
      # A fork holding its own secrets could otherwise dispatch this workflow
      # and publish under the real publisher's name.
      - name: Require the canonical repository
        run: |
          if [ "$GITHUB_REPOSITORY" != "GemTalk/Jasper" ]; then
            echo "error: this workflow publishes as 'gemtalksystems' and must only run in" >&2
            echo "GemTalk/Jasper (running in $GITHUB_REPOSITORY)." >&2
            exit 1
          fi
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "error: dispatch this workflow against ${DEFAULT_BRANCH}, not ${GITHUB_REF}." >&2
            echo "Only a commit already on ${DEFAULT_BRANCH} has been through the merge queue." >&2
            exit 1
          fi
          echo "Releasing ${GITHUB_SHA} from ${GITHUB_REF}."
      - name: Require the tag to be free
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "error: tag v$VERSION already exists — $VERSION looks released." >&2
            exit 1
          fi
      # The release does not re-run lint/compile/test: the merge queue already
      # ran them on this commit, across every platform and supported GemStone
      # version, which is a stronger gate than any single run here could be.
      # What matters is that it actually passed.
      - name: Require ci-complete to have passed on this commit
        run: |
          # A commit can carry several ci-complete runs, because a failed run
          # can be retried. Order is not guaranteed, so sort by start time and
          # read the newest: taking an arbitrary one risks reading a stale
          # success for a commit whose latest run failed.
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --paginate --jq '.check_runs[] | select(.name == "ci-complete") | [.started_at, .conclusion] | @tsv' |
            sort -r | head -1 | cut -f2)
          if [ -z "$conclusion" ]; then
            echo "error: no ci-complete check run found for $GITHUB_SHA." >&2
            echo "Health Check may still be running, or this commit never went through it." >&2
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "error: ci-complete concluded '$conclusion' for $GITHUB_SHA, not success." >&2
            exit 1
          fi
          echo "ci-complete passed on $GITHUB_SHA."
      - name: Require package.json to be at the requested version
        run: |
          actual=$(gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${GITHUB_SHA}" \
            -H "Accept: application/vnd.github.raw" | jq -r .version)
          if [ "$actual" != "$VERSION" ]; then
            echo "error: package.json is at $actual, but $VERSION was requested." >&2
            echo "Either publish $actual, or merge the bump to $VERSION first." >&2
            exit 1
          fi
      # Two separate mistakes, so two separate checks: a missing dated section
      # means the changelog was never promoted, and a non-empty [Unreleased]
      # means it was only half promoted — which ships release notes that omit
      # real changes, and reads to a user as though those changes are still
      # unreleased.
      - name: Require a promoted changelog section
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md?ref=${GITHUB_SHA}" \
            -H "Accept: application/vnd.github.raw" > /tmp/CHANGELOG.md

          # Dots are regex metacharacters, and the version reaches here as a
          # literal; escape them so 1.8.1 cannot match 1_8_1.
          esc=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          if ! grep -Eq "^## \[$esc\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" /tmp/CHANGELOG.md; then
            echo "error: CHANGELOG.md has no dated '## [$VERSION] - <date>' section at $GITHUB_SHA." >&2
            echo "Promote the [Unreleased] section and merge that before releasing." >&2
            exit 1
          fi

          leftover=$(awk '
              /^## \[Unreleased\]/ { inside = 1; next }
              /^## \[/            { inside = 0 }
              inside && NF        { print }
          ' /tmp/CHANGELOG.md)
          if [ -n "$leftover" ]; then
            echo "error: [Unreleased] still has entries at $GITHUB_SHA:" >&2
            printf '%s\n' "$leftover" | head -5 >&2
            echo "Promote them into [$VERSION], or move them out deliberately, before releasing." >&2
            exit 1
          fi
          echo "CHANGELOG.md has a dated [$VERSION] section and an empty [Unreleased]."

  # `validate` has no checkout, so its changelog check is weaker than the
  # one that matters: `release` renders the notes with the script below. A
  # changelog that passes validate but not the script would be approved at
  # the gate, get tagged, and only then fail, one step after the tag, in the
  # one place the docs' failure table says needs manual cleanup. Running the
  # real script here moves that whole class of failure to before anything
  # irreversible has happened.
  release-notes:
    name: Release notes
    needs: validate
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # zizmor(unpinned-uses): actions must be pinned to a commit SHA, not
      # a mutable tag like @v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor(artipacked): checkout must not persist the token past
          # this job
          persist-credentials: false
          sparse-checkout: |
            scripts/changelog-section.sh
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Require the release notes to render
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/changelog-section.sh "$VERSION" > /dev/null

  # Builds and scans the one artifact every later job uses. Nothing here is
  # irreversible, so it runs before the approval gate: a reviewer should be
  # approving a real package that has already been built and scanned, not a
  # promise.
  #
  # `overwrite-vsix` is deliberately left at its default (false), and that is
  # load-bearing: a re-run must never replace the .vsix with different bytes
  # than the ones a reviewer approved and a Release may already carry. "Re-run
  # all jobs" therefore fails here; use "Re-run failed jobs".
  package:
    name: Package
    needs: [validate, release-notes]
    permissions:
      contents: read
    # './...' rather than zizmor's preferred '$/...', which actionlint
    # rejects as a malformed remote reference.
    uses: ./.github/workflows/package-and-scan.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ inputs.version }}

  # Deliberately empty. Its entire purpose is to hold the run at the
  # `release-approval` environment until a required reviewer approves, with a
  # built package and a clean scan already in hand to look at.
  #
  # Everything below this line is irreversible. The registries are immutable
  # per (publisher, name, version), so a publish that goes wrong burns this
  # version number for good — there is no retry, only the next version.
  #
  # This environment must hold NO secrets: the registry tokens live on the two
  # publish environments instead, so approving a release does not hand the
  # build a credential.
  gate:
    name: Release approval
    needs: [package, release-notes]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: release-approval
    permissions: {}
    steps:
      # zizmor(template-injection): bind the actor to an env var rather than
      # interpolating ${{ }} into the run block
      - env:
          ACTOR: ${{ github.actor }}
        run: echo "Approved by ${ACTOR}."

  # The GitHub Release is created before either registry is touched, and is the
  # source of the bytes both of them receive. That ordering is the whole point:
  # the cheap, repeatable step goes first, so a registry failure later leaves a
  # tag and a Release describing exactly what was attempted, rather than a
  # published version with no record of it anywhere in the repository.
  release:
    name: Create the GitHub Release
    needs: [gate, package]
    if: ${{ !inputs.dry-run }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # zizmor(unpinned-uses): actions must be pinned to a commit SHA, not
      # a mutable tag like @v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor(artipacked): checkout must not persist the token past this
          # job. The tag is created through the API rather than pushed.
          persist-credentials: false
      - name: Download the .vsix
        # zizmor(unpinned-uses): actions must be pinned to a commit SHA,
        # not a mutable tag like @v6
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact-name }}
      - name: Tag the release
        run: |
          # Annotated, matching the tags every previous release carries: the
          # API needs the tag object created before the ref that points to it.
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="v${VERSION}" \
            -f message="Release ${VERSION}" \
            -f object="${GITHUB_SHA}" \
            -f type=commit \
            --jq .sha)
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSION}" \
            -f sha="${tag_sha}" > /dev/null
          echo "Tagged v${VERSION} at ${GITHUB_SHA}."
      - name: Publish the Release with the .vsix attached
        env:
          VSIX_FILE: ${{ needs.package.outputs.vsix-file }}
        run: |
          # Draft first, attach, then publish. That is GitHub's documented
          # sequence for immutable releases: the assets and the tag are locked
          # at the moment the release stops being a draft, and the release
          # attestation is generated then. Creating it non-draft and uploading
          # afterwards would leave a window where the release exists without
          # the file the publish jobs are about to fetch.
          bash scripts/changelog-section.sh "$VERSION" > release-notes.md
          gh release create "v${VERSION}" \
            --draft \
            --title "${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag \
            "$VSIX_FILE"
          gh release edit "v${VERSION}" --draft=false
          echo "Released v${VERSION}."

  # The two registries are published independently and neither waits for the
  # other. Sequential steps in one job — which is what `npm run publish` does
  # locally, and what the first draft of this workflow did — mean a Marketplace
  # failure silently skips Open VSX entirely. Split like this, one registry
  # failing leaves the other published and the failed half can be retried on
  # its own with "Re-run failed jobs".
  publish-vsce:
    name: Publish to the VS Code Marketplace
    needs: [package, release]
    if: ${{ !inputs.dry-run }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: release-vsce
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # zizmor(unpinned-uses): actions must be pinned to a commit SHA, not
      # a mutable tag like @v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        # zizmor(unpinned-uses): actions must be pinned to a commit SHA,
        # not a mutable tag like @v6
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      # The CLI comes from the lockfile rather than from `npx` reaching the
      # network, so the version that publishes a release is the version the
      # repo pinned and CI has been exercising.
      - name: Install dependencies
        run: npm ci
      - name: Verify the token
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install @vscode/vsce verify-pat gemtalksystems
      # Exactly the bytes attached to the Release — never a rebuild. This is
      # the property the manual runbook could not have: the file inspected on
      # the Release and the file each registry serves are the same object.
      - name: Download the .vsix from the Release
        run: gh release download "v${VERSION}" --pattern '*.vsix' --dir .
      - name: Publish
        timeout-minutes: 5
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX_FILE: ${{ needs.package.outputs.vsix-file }}
        run: bash scripts/publish-to-registry.sh marketplace "$VSIX_FILE"

  publish-ovsx:
    name: Publish to Open VSX
    needs: [package, release]
    if: ${{ !inputs.dry-run }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: release-ovsx
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # zizmor(unpinned-uses): actions must be pinned to a commit SHA, not
      # a mutable tag like @v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        # zizmor(unpinned-uses): actions must be pinned to a commit SHA,
        # not a mutable tag like @v6
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Verify the token
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --no-install ovsx verify-pat gemtalksystems
      - name: Download the .vsix from the Release
        run: gh release download "v${VERSION}" --pattern '*.vsix' --dir .
      - name: Publish
        timeout-minutes: 5
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX_FILE: ${{ needs.package.outputs.vsix-file }}
        run: bash scripts/publish-to-registry.sh openvsx "$VSIX_FILE"

  # Reports, and does not gate. By the time this runs the tag, the Release and
  # both uploads already exist, so there is nothing left for a failure here to
  # protect — it can only tell you the registries are slower than the budget.
  # Nothing depends on this job, so a red result is a signal to go and look,
  # not a broken release.
  verify:
    name: Verify both registries
    needs: [publish-vsce, publish-ovsx]
    if: ${{ !inputs.dry-run }}
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # zizmor(unpinned-uses): actions must be pinned to a commit SHA, not
      # a mutable tag like @v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        # zizmor(unpinned-uses): actions must be pinned to a commit SHA,
        # not a mutable tag like @v6
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Wait for both registries to serve the version
        run: bash scripts/await-published-version.sh "$VERSION"
