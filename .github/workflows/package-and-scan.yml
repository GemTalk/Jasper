name: Package

# Builds the .vsix and scans it for secrets, in two jobs. The release and
# every PR run it, so anything that would break a release fails the PR that
# causes it. Inputs may change how the .vsix artifact is kept, never what is
# built or scanned; keep it that way, since that sameness is what makes the
# PR run a release rehearsal.
#
# The scan is a separate job on purpose: it runs on a fresh checkout where
# no `npm ci` lifecycle script and no build step has run, so nothing the
# build executes can touch the scanner, its config or the scanned bytes.

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Version the build must produce. Empty means whatever package.json
          says. Pass the version you expect so a mismatch fails here rather
          than at upload.
        required: false
        default: ''
        type: string
      overwrite-vsix:
        description: >-
          Let a re-run replace the .vsix artifact. Artifacts are scoped to
          the run, not the attempt, so when false, "Re-run all jobs" fails
          with 409 Conflict instead of rebuilding different bytes.
        required: false
        default: false
        type: boolean
      vsix-retention-days:
        description: >-
          Days to keep the .vsix artifact. 0 means the repository default
          (upload-artifact's own convention); there is no "delete now".
        required: false
        default: 0
        type: number
    outputs:
      artifact-name:
        description: Name of the uploaded .vsix artifact
        value: ${{ jobs.build.outputs.artifact-name }}
      vsix-file:
        description: File name of the .vsix inside that artifact
        value: ${{ jobs.build.outputs.vsix-file }}

permissions: {}

jobs:
  build:
    name: Build
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      artifact-name: ${{ steps.package.outputs.artifact-name }}
      vsix-file: ${{ steps.package.outputs.vsix-file }}
    steps:
      # zizmor(unpinned-uses): actions must be pinned to a commit SHA, not
      # a mutable tag like @v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor(artipacked): checkout must not persist the token past
          # this job. Nothing here pushes.
          persist-credentials: false
      # No npm cache: a publishing workflow must not restore build inputs
      # from a cache (zizmor's cache-poisoning audit), and every caller
      # gets the same build rather than a faster, different one.
      - name: Setup Node.js
        # zizmor(unpinned-uses): actions must be pinned to a commit SHA,
        # not a mutable tag like @v6
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      # Runs vsce's full packaging path (esbuild bundle + the production
      # dependency walk `npm list --production --parseable --depth=99999`).
      # An `overrides` entry resolved outside its declaring package's range
      # marks that edge `invalid`, `npm list` exits non-zero, and packaging
      # aborts (see issue #351).
      - name: Package
        id: package
        # zizmor(template-injection): bind the input to an env var instead
        # of interpolating ${{ }} directly into the run script
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # vsce honours SOURCE_DATE_EPOCH when it writes the vsix ("reproducible
          # zip files" in its writeVsix). Without it every build stamps "now"
          # into the zip entries, so two builds of the same commit differ
          # byte-for-byte and comparing the artifact to a rebuild proves nothing.
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          npm run package

          version="${INPUT_VERSION:-$(node -p "require('./package.json').version")}"
          vsix="gemstone-ide-${version}.vsix"
          if [ ! -f "$vsix" ]; then
            echo "error: expected $vsix, but packaging produced:" >&2
            ls -1 ./*.vsix 2>/dev/null || echo "  (no .vsix at all)" >&2
            exit 1
          fi
          echo "Built $vsix ($(du -h "$vsix" | cut -f1))."
          {
            echo "version=$version"
            echo "artifact-name=gemstone-ide-${version}-vsix"
            echo "vsix-file=$vsix"
          } >> "$GITHUB_OUTPUT"
      # Uploaded before the scan because the scan job needs it. A .vsix that
      # fails the scan is still never used: callers depend on this whole
      # workflow, so nothing downstream runs unless the scan passed.
      - name: Upload the .vsix
        # zizmor(unpinned-uses): actions must be pinned to a commit SHA,
        # not a mutable tag like @v6
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: ${{ steps.package.outputs.vsix-file }}
          if-no-files-found: error
          overwrite: ${{ inputs.overwrite-vsix }}
          retention-days: ${{ inputs.vsix-retention-days }}

  # Scans the package pre-image, before anything can be uploaded to a
  # registry. Open VSX runs its own gitleaks-based scan server-side AFTER
  # accepting an upload, with no way to allow a false positive, and by then
  # the version number is spent. This repo has been rejected that way twice
  # (1.7.6, 1.8.3). Catching it here costs a failed run; catching it there
  # costs a version.
  scan:
    name: Secret scan
    needs: build
    timeout-minutes: 3
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Pinned, with the checksum published alongside that release, because
      # this is a security control: an unpinned scanner is one supply-chain
      # step away from being a scanner that finds nothing.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # zizmor(unpinned-uses): actions must be pinned to a commit SHA, not
      # a mutable tag like @v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only .gitleaks.toml is needed from the tree; nothing here runs it.
          persist-credentials: false
          sparse-checkout: .gitleaks.toml
          sparse-checkout-cone-mode: false
      - name: Download the .vsix
        # zizmor(unpinned-uses): actions must be pinned to a commit SHA,
        # not a mutable tag like @v6
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/vsix
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          # Retry rather than let a brief outage of github.com release
          # downloads fail the run.
          # --max-time applies per attempt, so a stalled transfer times out
          # and retries; 4 attempts fit inside the job's 3 minutes.
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --retry-delay 5 -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the packaged .vsix
        id: scan
        env:
          VSIX_FILE: ${{ needs.build.outputs.vsix-file }}
        run: |
          # The scan target is the UNZIPPED package, not the working tree. The
          # tree simultaneously misses what ships (the esbuild bundles are in
          # the .vsix but not in git, and both historical rejections lived in
          # bundled output) and floods on what does not: .vscodeignore drops
          # client/tmp/**, ~1GB of fixtures including example private keys.
          # Scanning git history would be worse on both counts.
          contents="$RUNNER_TEMP/vsix-contents"
          mkdir -p "$contents"
          unzip -q "$RUNNER_TEMP/vsix/${VSIX_FILE}" -d "$contents"
          "$RUNNER_TEMP/gitleaks" dir "$contents" \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-report.json"
      - name: Upload the scan report
        if: failure() && steps.scan.outcome == 'failure'
        # zizmor(unpinned-uses): actions must be pinned to a commit SHA,
        # not a mutable tag like @v6
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Artifacts are scoped to the run, not the attempt, so `overwrite`
          # lets "Re-run failed jobs" replace the previous attempt's report
          # instead of failing with 409.
          name: gitleaks-report-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: warn
          overwrite: true
